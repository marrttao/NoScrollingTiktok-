name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Morphe's patcher and Gradle plugin are hosted on GitHub Packages.
  packages: read

jobs:
  build:
    name: Build patches and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:tiktok:testDebugUnitTest :patches:test --no-daemon

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Inspect patch bundle
        run: |
          set -euo pipefail
          bundle=$(ls patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc)
          echo "bundle: $bundle"
          unzip -l "$bundle" | grep -E 'classes.dex|extensions/tiktok.mpe'
          unzip -p "$bundle" META-INF/MANIFEST.MF
          sha256sum "$bundle"

      - name: Upload patch bundle
        uses: actions/upload-artifact@v6
        with:
          name: unscroll-patches
          path: |
            patches/build/libs/patches-*.mpp
            !patches/build/libs/*sources*
            !patches/build/libs/*javadoc*
          if-no-files-found: error

  verify-apk:
    name: Apply patches to TikTok ${{ matrix.tiktok }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tiktok: ['46.2.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download patch bundle
        uses: actions/download-artifact@v7
        with:
          name: unscroll-patches
          path: bundle

      # The original APK stays in the runner's temp directory and is deleted with it.
      # It is never uploaded, cached or attached to anything. Source: the repository
      # secret TIKTOK_APK_URL (a private direct link set by the maintainer), otherwise
      # APKMirror (which usually blocks CI runners).
      - name: Fetch original TikTok APK
        id: apk
        env:
          TIKTOK_APK_URL: ${{ secrets.TIKTOK_APK_URL }}
        run: |
          set -uo pipefail
          if [[ -n "${TIKTOK_APK_URL:-}" ]]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tiktok.apk" "$TIKTOK_APK_URL" && ok=1 || ok=0
          else
            scripts/fetch-tiktok-apk.sh "${{ matrix.tiktok }}" "$RUNNER_TEMP/tiktok.apk" && ok=1 || ok=0
          fi
          if [[ "$ok" == 1 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Patches NOT verified::Original TikTok ${{ matrix.tiktok }} APK unavailable in CI; patch application was not verified."
          fi

      - name: Check original APK identity and signature
        if: steps.apk.outputs.available == 'true'
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$bt/aapt2" dump badging "$RUNNER_TEMP/tiktok.apk" | head -n1 | tee "$RUNNER_TEMP/badging.txt"
          grep -q "name='com.zhiliaoapp.musically'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='${{ matrix.tiktok }}'" "$RUNNER_TEMP/badging.txt"
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/tiktok.apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'

      - name: Apply Unscroll patches (fail-closed)
        if: steps.apk.outputs.available == 'true'
        run: |
          set -euo pipefail
          bundle=$(ls bundle/patches-*.mpp | head -n1)
          scripts/unscroll-patch.sh --apk "$RUNNER_TEMP/tiktok.apk" --bundle "$bundle" \
            --keystore "$RUNNER_TEMP/ci-throwaway.keystore" --out "$RUNNER_TEMP/unscroll.apk"

      - name: Check patched APK
        if: steps.apk.outputs.available == 'true'
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$bt/aapt2" dump badging "$RUNNER_TEMP/unscroll.apk" | head -n1
          "$bt/aapt2" dump badging "$RUNNER_TEMP/unscroll.apk" | grep -q "name='com.zhiliaoapp.musically'"
          "$bt/apksigner" verify --verbose "$RUNNER_TEMP/unscroll.apk" | head -n8
          # The Unscroll extension must be present in the patched dex files.
          unzip -o -q "$RUNNER_TEMP/unscroll.apk" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          grep -l -a 'Lapp/unscroll/extension/tiktok/navigation/TabPolicy;' "$RUNNER_TEMP"/dex/classes*.dex

      - name: Remove APKs
        if: always()
        run: rm -rf "$RUNNER_TEMP"/*.apk "$RUNNER_TEMP/dex"
